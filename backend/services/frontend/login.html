<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Reporting System</title>
   
    <link rel="stylesheet" href="css/styles_login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <!-- Simulated institutional logo -->
            <img src="img/logo.png" alt="Institutional Logo" class="logo" onerror="this.style.display='none'">
            <h2>Report Management System</h2>
            <p>Administrative Access</p>
        </div>

        <form class="login-form">
            <div class="input-group">
                <label for="identifier">ID or Email</label>
                <input 
                    type="text" 
                    id="identifier" 
                    name="identifier" 
                    placeholder="Enter your ID or email" 
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="********" 
                    required
                >
            </div>

            <button type="submit" class="btn-login">Log In</button>
        </form>
    </div>
</body>
</html>
