<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Reportes</title>
    <!-- Vinculación con los estilos que realiza Paola -->
    <link rel="stylesheet" href="css/styles_login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <!-- Logo institucional simulado -->
            <img src="img/logo.png" alt="Logo Institucional" class="logo" onerror="this.style.display='none'">
            <h2>Sistema de Gestión de Reportes</h2>
            <p>Acceso Administrativo</p>
        </div>

        <form action="/api/auth/login" method="POST" class="login-form">
            <div class="input-group">
                <label for="identifier">ID o Correo Electrónico</label>
                <input 
                    type="text" 
                    id="identifier" 
                    name="identifier" 
                    placeholder="Ingrese su ID o correo" 
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="********" 
                    required
                >
            </div>

            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>
    </div>
</body>
</html>
