services:
  mysql:
    image: mysql:8.4
    container_name: reportes-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: reportes
      MYSQL_USER: reportes_user
      MYSQL_PASSWORD: reportes123
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: