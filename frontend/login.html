<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Sistema de Reportes</title>
   
    <link rel="stylesheet" href="css/styles_login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <!-- Logo institucional -->
            <img src="img/logo.png" alt="Logo institucional" class="logo" onerror="this.style.display='none'">
            <h2>Sistema de Gestión de Reportes</h2>
            <p>Acceso administrativo</p>
        </div>

        <form class="login-form">
            <div class="input-group">
                <label for="identifier">ID o correo electrónico</label>
                <input 
                    type="text" 
                    id="identifier" 
                    name="identifier" 
                    placeholder="Ingresa tu ID o correo" 
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="********" 
                    required
                >
            </div>

            <button type="submit" class="btn-login">Iniciar sesión</button>
        </form>
    </div>
</body>
</html>
